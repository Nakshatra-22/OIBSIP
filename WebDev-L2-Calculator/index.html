<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla JavaScript Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
        }

        .calculator {
            background-color: #22252d;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 320px;
        }

        .display {
            background-color: #292d36;
            color: #ffffff;
            font-size: 2rem;
            padding: 20px;
            text-align: right;
            border-radius: 10px;
            margin-bottom: 20px;
            word-wrap: break-word;
            word-break: break-all;
            min-height: 80px;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            background-color: #272b33;
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #343842;
        }

        button:active {
            transform: scale(0.95);
        }

        .operator {
            background-color: #2e4156;
            color: #4e9f3d;
            font-weight: bold;
        }

        .operator:hover {
            background-color: #3b526c;
        }

        .action {
            color: #ff6584;
        }

        .equals {
            background-color: #4e9f3d;
            color: #ffffff;
            grid-column: span 2;
        }

        .equals:hover {
            background-color: #5ab847;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div id="display" class="display">0</div>
        <div class="buttons-grid">
            <button class="action" data-action="clear">C</button>
            <button class="action" data-action="backspace">⌫</button>
            <button class="operator" data-operator="÷">÷</button>
            <button class="operator" data-operator="×">×</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operator="-">−</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operator="+">+</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="equals" data-action="calculate">=</button>

            <button data-number="0">0</button>
            <button data-number=".">.</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const buttons = document.querySelector('.buttons-grid');

        let currentInput = '0';
        let previousInput = null;
        let operation = null;
        let resetScreen = false;

        function updateDisplay() {
            display.textContent = currentInput;
        }

        function handleNumber(num) {
            if (currentInput === '0' || resetScreen) {
                currentInput = num;
                resetScreen = false;
            } else {
                currentInput += num;
            }
        }

        function handleDecimal() {
            if (resetScreen) {
                currentInput = '0.';
                resetScreen = false;
                return;
            }
            if (!currentInput.includes('.')) {
                currentInput += '.';
            }
        }

        function handleOperator(op) {
            if (operation !== null && !resetScreen) {
                evaluate();
            }
            previousInput = currentInput;
            operation = op;
            resetScreen = true;
        }

        function evaluate() {
            if (operation === null || previousInput === null) return;

            let result;
            const prev = parseFloat(previousInput);
            const curr = parseFloat(currentInput);

            if (isNaN(prev) || isNaN(curr)) return;

            switch (operation) {
                case '+':
                    result = prev + curr;
                    break;
                case '-':
                    result = prev - curr;
                    break;
                case '×':
                    result = prev * curr;
                    break;
                case '÷':
                    if (curr === 0) {
                        currentInput = "Error: Division by zero";
                        resetAll();
                        return;
                    }
                    result = prev / curr;
                    break;
                default:
                    return;
            }

            currentInput = roundResult(result).toString();
            operation = null;
            previousInput = null;
            resetScreen = true;
        }

        function roundResult(number) {
            return Math.round(number * 100000000) / 100000000;
        }

        function resetAll() {
            previousInput = null;
            operation = null;
            resetScreen = true;
        }

        function clearCalculator() {
            currentInput = '0';
            previousInput = null;
            operation = null;
            resetScreen = false;
        }

        function backspace() {
            if (resetScreen) return;
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
        }

        buttons.addEventListener('click', (event) => {
            const target = event.target;
            if (!target.matches('button')) return;

            // Prevent error state from locking calculator permanently
            if (currentInput.startsWith("Error")) {
                clearCalculator();
            }

            if (target.dataset.number !== undefined) {
                if (target.dataset.number === '.') {
                    handleDecimal();
                } else {
                    handleNumber(target.dataset.number);
                }
            } else if (target.dataset.operator !== undefined) {
                handleOperator(target.dataset.operator);
            } else if (target.dataset.action !== undefined) {
                const action = target.dataset.action;
                if (action === 'clear') {
                    clearCalculator();
                } else if (action === 'backspace') {
                    backspace();
                } else if (action === 'calculate') {
                    evaluate();
                }
            }

            updateDisplay();
        });
    </script>
</body>
</html>
